name: Build mobile debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Build mobile debug APK
        run: ./gradlew :app:assembleMobileDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huoyi-tv-mobile-debug
          path: app/build/outputs/apk/mobile/debug/
