name: Build mobile debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(echo $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | cut -d' ' -f1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "cmdline-tools;latest"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --list_installed
          "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"; fi
      - name: Create local.properties for CI
        run: |
          printf 'sdk.dir=%s\nstoreFile=debug.keystore\nkeyAlias=debug\nstorePassword=debug\n' "$ANDROID_HOME" > local.properties
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build mobile debug APK
        run: ./gradlew :app:assembleMobileDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huoyi-tv-mobile-debug
          path: app/build/outputs/apk/mobile/debug/
